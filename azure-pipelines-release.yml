# This pipeline does NOT trigger automatically on push.
# It is triggered manually, or automatically after the Build pipeline succeeds
# (configured via 'resources.pipelines' below).
trigger: none

resources:
  pipelines:
    - pipeline: buildPipeline        # local alias used to reference artifacts below
      source: 'Notes_Application-Build'   # must exactly match the Build pipeline's name in Azure DevOps
      trigger:
        branches:
          include:
            - master
            - deploy-application

variables:
  - group: notes-app-secrets
  - name: azureServiceConnection
    value: 'azure-notes-app-connection'
  - name: appProjectDirectory
    value: '$(System.DefaultWorkingDirectory)/Notes_Application'
  - name: appServiceName
    value: 'app-notes-application'
  - name: resourceGroupName
    value: 'rg-notes-app'
  - name: sqlServerName
    value: 'sql-notes-app-cus'
  - name: sqlServerFqdn
    value: 'sql-notes-app-cus.database.windows.net'
  - name: sqlDatabaseName
    value: 'ProductDb'
  - name: sqlAdminLogin
    value: 'sqladmin'

stages:

  # =========================================================
  # RELEASE STAGE 1: Infrastructure (Terraform)
  # =========================================================
  - stage: ReleaseInfrastructure
    displayName: 'Release: Infrastructure (Terraform)'
    jobs:
      - deployment: TerraformApply
        displayName: 'Provision/Update Azure Infrastructure'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production-infra'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: buildPipeline
                  artifact: 'terraform-drop'
                  displayName: 'Download Terraform Artifact from Build'

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: '1.9.0'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(Pipeline.Workspace)/buildPipeline/terraform-drop'
                    backendServiceArm: '$(azureServiceConnection)'
                    backendAzureRmResourceGroupName: 'rg-terraform-state'
                    backendAzureRmStorageAccountName: 'sttfstatenotesapp'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'notes-application.tfstate'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Plan'
                  inputs:
                    provider: 'azurerm'
                    command: 'plan'
                    workingDirectory: '$(Pipeline.Workspace)/buildPipeline/terraform-drop'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    commandOptions: '-var="sql_admin_password=$(sqlAdminPassword)"'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(Pipeline.Workspace)/buildPipeline/terraform-drop'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    commandOptions: '-var="sql_admin_password=$(sqlAdminPassword)" -auto-approve'

  # =========================================================
  # RELEASE STAGE 2: Deploy App to App Service
  # =========================================================
  - stage: ReleaseApp
    displayName: 'Release: Deploy App to App Service'
    dependsOn: ReleaseInfrastructure
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy to Azure App Service'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: buildPipeline
                  artifact: 'app-drop'
                  displayName: 'Download App Artifact from Build'

                - task: AzureWebApp@1
                  displayName: 'Deploy App Package'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(appServiceName)'
                    package: '$(Pipeline.Workspace)/buildPipeline/app-drop/*.zip'

  # =========================================================
  # RELEASE STAGE 3: Apply EF Core Migrations
  # =========================================================
  - stage: ReleaseMigrateDatabase
    displayName: 'Release: Apply EF Core Migrations'
    dependsOn: ReleaseApp
    jobs:
      - job: RunMigrations
        displayName: 'Run dotnet ef database update'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            displayName: 'Checkout source for migration project'

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          - script: dotnet tool install --global dotnet-ef
            displayName: 'Install dotnet-ef tool'

          - task: AzureCLI@2
            displayName: 'Temporarily Allow Pipeline Agent IP on SQL Firewall'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                AGENT_IP=$(curl -s https://api.ipify.org)
                az sql server firewall-rule create \
                  --resource-group $(resourceGroupName) \
                  --server $(sqlServerName) \
                  --name AllowPipelineAgent \
                  --start-ip-address $AGENT_IP \
                  --end-ip-address $AGENT_IP
                az sql server update \
                  --name $(sqlServerName) \
                  --resource-group $(resourceGroupName) \
                  --set publicNetworkAccess=Enabled

          - script: |
              export PATH="$PATH:$HOME/.dotnet/tools"
              dotnet ef database update \
                --project "$(appProjectDirectory)/Notes_Application.csproj" \
                --connection "Server=tcp:$(sqlServerFqdn),1433;Database=$(sqlDatabaseName);User ID=$(sqlAdminLogin);Password=$(sqlAdminPassword);Encrypt=true;"
            displayName: 'Apply EF Core Migrations'

          - task: AzureCLI@2
            displayName: 'Revert SQL Firewall to Private-Only'
            condition: always()
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az sql server firewall-rule delete \
                  --resource-group $(resourceGroupName) \
                  --server $(sqlServerName) \
                  --name AllowPipelineAgent || true
                az sql server update \
                  --name $(sqlServerName) \
                  --resource-group $(resourceGroupName) \
                  --set publicNetworkAccess=Disabled